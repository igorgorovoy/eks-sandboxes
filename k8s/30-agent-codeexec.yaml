# The "agent + code-exec" pattern for the article:
# the agent (isolated-sandbox, has network) runs generated code in a separate pod
# with network-isolated (no DNS, IMDS, Pod Identity, or SA token).
# Exchange goes only through the API server: ConfigMap in, exec logs back.
# Why not emptyDir — see article/PLAN.md (it is pod-scoped, and the annotation is pod-level).
#
# Hypotheses this manifest verifies (experiment 5 in article/PLAN.md):
#   1. A ConfigMap mounts inside the sandbox VM
#   2. network-isolated cuts pod networking, but kubelet exec/logs still work
#   3. The SA token is absent in a network-isolated pod (automountServiceAccountToken: false)
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-demo
---
# RBAC limited to its own namespace: pods, their logs, configmaps — that's it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent
  namespace: agent-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent
  namespace: agent-demo
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: agent-demo
roleRef:
  kind: Role
  name: agent
  apiGroup: rbac.authorization.k8s.io
---
# Agent script. No kubectl and no jq — raw REST calls via curl
# (the SA token and CA are already mounted by kubelet; it's a file, not the network).
# The code is passed via binaryData as base64 — to avoid JSON-escaping in shell.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-script
  namespace: agent-demo
data:
  agent.sh: |
    #!/bin/sh
    set -eu
    API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN=$(cat "$SA/token")
    CA="$SA/ca.crt"
    NS=$(cat "$SA/namespace")
    TIMEOUT=${TIMEOUT:-300}

    req() { curl -sS --cacert "$CA" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }

    # --- 1. Code ---
    # Demo mode: DEMO_CODE from env. For an LLM, plug in your provider below —
    # the pattern is unchanged: $CODE must exist at this point.
    CODE=${DEMO_CODE:?DEMO_CODE is not set}
    # LLM variant (adapt to your provider, e.g. OpenAI-compatible):
    # CODE=$(req -X POST -H "Authorization: Bearer $LLM_API_KEY" \
    #   -d '{"model":"...","messages":[{"role":"user","content":"write a python script…"}]}' \
    #   "$LLM_API_URL" | ...extract)

    RUN_ID="codeexec-$(date +%s)-$RANDOM"
    echo "[agent] code ready, launching $RUN_ID"

    # --- 2. ConfigMap with the code (binaryData — no escaping) ---
    CM="$RUN_ID-task"
    req -X POST -d '{
      "apiVersion":"v1","kind":"ConfigMap",
      "metadata":{"name":"'"$CM"'","namespace":"'"$NS"'"},
      "binaryData":{"run.sh":"'"$(printf '%s' "$CODE" | base64 | tr -d '\n')"'"}
    }' "$API/api/v1/namespaces/$NS/configmaps" >/dev/null

    # --- 3. codeexec-pod ---
    # automountServiceAccountToken: false — the generated code gets no access to the K8s API at all.
    req -X POST -d '{
      "apiVersion":"v1","kind":"Pod",
      "metadata":{"name":"'"$RUN_ID"'","namespace":"'"$NS"'",
        "annotations":{"sandbox.amazonaws.com/network-isolated":"true"}},
      "spec":{
        "runtimeClassName":"isolated-sandbox",
        "nodeSelector":{"sandbox-runtime":"nitro"},
        "tolerations":[{"key":"sandbox","operator":"Equal","value":"nitro","effect":"NoSchedule"}],
        "automountServiceAccountToken":false,
        "restartPolicy":"Never",
        "containers":[{"name":"exec",
          "image":"public.ecr.aws/docker/library/busybox:1.36",
          "command":["sh","/task/run.sh"],
          "volumeMounts":[{"name":"task","mountPath":"/task"}],
          "resources":{"requests":{"cpu":"1","memory":"512Mi"},"limits":{"cpu":"1","memory":"512Mi"}}}],
        "volumes":[{"name":"task","configMap":{"name":"'"$CM"'"}}]
      }
    }' "$API/api/v1/namespaces/$NS/pods" >/dev/null

    # --- 4. Wait for Succeeded/Failed (kubelet exec channel -> VM, not pod network) ---
    PHASE=Pending; i=0
    while [ "$PHASE" != "Succeeded" ] && [ "$PHASE" != "Failed" ] && [ $i -lt $TIMEOUT ]; do
      sleep 2; i=$((i+2))
      PHASE=$(req "$API/api/v1/namespaces/$NS/pods/$RUN_ID" \
        | sed -n 's/.*"phase":"\([A-Za-z]*\)".*/\1/p' | head -1)
      PHASE=${PHASE:-Pending}
    done
    echo "[agent] $RUN_ID: phase=$PHASE in ${i}s"

    # --- 5. Generated code stdout -> back to the agent ---
    echo "----- codeexec output -----"
    req "$API/api/v1/namespaces/$NS/pods/$RUN_ID/log"
    echo "----- end -----"

    # --- 6. Clean up ---
    req -X DELETE "$API/api/v1/namespaces/$NS/pods/$RUN_ID" >/dev/null
    req -X DELETE "$API/api/v1/namespaces/$NS/configmaps/$CM" >/dev/null
    echo "[agent] cleanup done"
---
# Agent: isolated-sandbox with network (LLM API, K8s API). The SA token is required here — it is a projected
# volume from kubelet, not IMDS; network-isolated does not touch it (verified by experiment 5).
apiVersion: v1
kind: Pod
metadata:
  name: agent
  namespace: agent-demo
spec:
  serviceAccountName: agent
  # Single-shot demo loop: without this the container exits 0 and kubelet
  # restarts it forever (observed live: RESTARTS 2 + repeated runs).
  restartPolicy: Never
  runtimeClassName: isolated-sandbox
  nodeSelector: { sandbox-runtime: nitro }
  tolerations:
    - { key: sandbox, operator: Equal, value: nitro, effect: NoSchedule }
  containers:
    - name: agent
      # alpine: curl and base64 available after apk add; busybox wget's TLS is not enough for the K8s API
      image: public.ecr.aws/docker/library/alpine:3.21
      command: ["sh", "-c", "apk add --no-cache curl >/dev/null && sh /agent/agent.sh"]
      env:
        # Demo code: self-checks its own isolation, and screenshots well for the article.
        - name: DEMO_CODE
          value: |
            echo "kernel: $(uname -r)"
            echo "interfaces: $(ls /sys/class/net | tr '\n' ' ')"
            if wget -q -T 3 -O /dev/null http://aws.amazon.com; then
              echo "NETWORK: reachable — isolation FAILED"
            else
              echo "NETWORK: blocked — isolation works"
            fi
            if [ -r /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
              echo "SA token: readable — FAILED"
            else
              echo "SA token: absent — expected"
            fi
            echo "uid: $(id -u)"
        # For LLM: Secret with the key, enable together with the block in agent.sh
        # - name: LLM_API_URL
        #   valueFrom: { secretKeyRef: { name: llm-credentials, key: url } }
        # - name: LLM_API_KEY
        #   valueFrom: { secretKeyRef: { name: llm-credentials, key: key } }
      volumeMounts:
        - { name: script, mountPath: /agent }
      resources:
        requests: { cpu: "1", memory: 512Mi }
        limits:   { cpu: "1", memory: 512Mi }
  volumes:
    - name: script
      configMap: { name: agent-script }
