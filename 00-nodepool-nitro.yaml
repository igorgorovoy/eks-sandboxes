# Auto Mode NodePool pinned to m8i.xlarge — the same instance type as the gVisor pool.
# HYPOTHESIS: check that pods with isolated-sandbox land on the custom NodePool.
# If they stay Pending — drop the nodeSelector and run the smoke test on the built-in
# general-purpose pool instead.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox-nitro
spec:
  template:
    metadata:
      labels:
        sandbox-runtime: nitro
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: ["m8i"]
        - key: eks.amazonaws.com/instance-size
          operator: In
          values: ["xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: sandbox
          value: nitro
          effect: NoSchedule
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # 60m на час бенчмарків: інакше холодна нода консолідується між прогонами
    # coldstart і «теплий» прогін стане холодним. Поверни 5m після бенчмарку.
    consolidateAfter: 60m
