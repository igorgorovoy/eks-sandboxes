# Патерн «агент + code-exec» для статті:
# агент (isolated-sandbox, мережа є) виконує згенерований код у окремому поді
# з network-isolated (без DNS, IMDS, Pod Identity і SA-токена).
# Обмін — тільки через API-сервер: ConfigMap туди, exec-логи назад.
# Чому не emptyDir — див. PLAN.md (pod-скиповний, а анотація pod-рівнева).
#
# Гіпотези, які перевіряє цей маніфест (експеримент 5 у PLAN.md):
#   1. ConfigMap монтується всередині sandbox VM
#   2. network-isolated відрізає pod-мережу, але exec/логи kubelet живі
#   3. SA-токен у network-isolated поді відсутній (automountServiceAccountToken: false)
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: agent-demo
---
# RBAC тільки у своєму namespace: поди, їхні логи, configmaps — і все.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent
  namespace: agent-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent
  namespace: agent-demo
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: agent-demo
roleRef:
  kind: Role
  name: agent
  apiGroup: rbac.authorization.k8s.io
---
# Скрипт агента. Без kubectl і jq — сирі REST-виклики curl'ом
# (токен SA і CA вже змонтовані kubelet'ом; це файл, а не мережа).
# Код передається через binaryData в base64 — щоб не екранувати JSON у shell.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-script
  namespace: agent-demo
data:
  agent.sh: |
    #!/bin/sh
    set -eu
    API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN=$(cat "$SA/token")
    CA="$SA/ca.crt"
    NS=$(cat "$SA/namespace")
    TIMEOUT=${TIMEOUT:-300}

    req() { curl -sS --cacert "$CA" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }

    # --- 1. Код ---
    # Демо-режим: DEMO_CODE з env. Для LLM підстав свого провайдера нижче —
    # патерн від цього не міняється: на виході блоку має бути $CODE.
    CODE=${DEMO_CODE:?DEMO_CODE не задано}
    # LLM-варіант (адаптуй під свого провайдера, напр. OpenAI-сумісний):
    # CODE=$(req -X POST -H "Authorization: Bearer $LLM_API_KEY" \
    #   -d '{"model":"...","messages":[{"role":"user","content":"напиши python-скрипт…"}]}' \
    #   "$LLM_API_URL" | ...extract)

    RUN_ID="codeexec-$(date +%s)-$RANDOM"
    echo "[agent] код готовий, запускаю $RUN_ID"

    # --- 2. ConfigMap з кодом (binaryData — без екранування) ---
    CM="$RUN_ID-task"
    req -X POST -d '{
      "apiVersion":"v1","kind":"ConfigMap",
      "metadata":{"name":"'"$CM"'","namespace":"'"$NS"'"},
      "binaryData":{"run.sh":"'"$(printf '%s' "$CODE" | base64 | tr -d '\n')"'"}
    }' "$API/api/v1/namespaces/$NS/configmaps" >/dev/null

    # --- 3. codeexec-pod ---
    # automountServiceAccountToken: false — згенерований код не має доступу до K8s API взагалі.
    req -X POST -d '{
      "apiVersion":"v1","kind":"Pod",
      "metadata":{"name":"'"$RUN_ID"'","namespace":"'"$NS"'",
        "annotations":{"sandbox.amazonaws.com/network-isolated":"true"}},
      "spec":{
        "runtimeClassName":"isolated-sandbox",
        "nodeSelector":{"sandbox-runtime":"nitro"},
        "tolerations":[{"key":"sandbox","operator":"Equal","value":"nitro","effect":"NoSchedule"}],
        "automountServiceAccountToken":false,
        "restartPolicy":"Never",
        "containers":[{"name":"exec",
          "image":"public.ecr.aws/docker/library/busybox:1.36",
          "command":["sh","/task/run.sh"],
          "volumeMounts":[{"name":"task","mountPath":"/task"}],
          "resources":{"requests":{"cpu":"1","memory":"512Mi"},"limits":{"cpu":"1","memory":"512Mi"}}}],
        "volumes":[{"name":"task","configMap":{"name":"'"$CM"'"}}]
      }
    }' "$API/api/v1/namespaces/$NS/pods" >/dev/null

    # --- 4. Чекаємо Succeeded/Failed (exec-канал kubelet → VM, не pod-мережа) ---
    PHASE=Pending; i=0
    while [ "$PHASE" != "Succeeded" ] && [ "$PHASE" != "Failed" ] && [ $i -lt $TIMEOUT ]; do
      sleep 2; i=$((i+2))
      PHASE=$(req "$API/api/v1/namespaces/$NS/pods/$RUN_ID" \
        | sed -n 's/.*"phase":"\([A-Za-z]*\)".*/\1/p' | head -1)
      PHASE=${PHASE:-Pending}
    done
    echo "[agent] $RUN_ID: фаза=$PHASE за ${i}s"

    # --- 5. stdout згенерованого коду → назад агенту ---
    echo "----- codeexec output -----"
    req "$API/api/v1/namespaces/$NS/pods/$RUN_ID/log"
    echo "----- end -----"

    # --- 6. Прибираємо за собою ---
    req -X DELETE "$API/api/v1/namespaces/$NS/pods/$RUN_ID" >/dev/null
    req -X DELETE "$API/api/v1/namespaces/$NS/configmaps/$CM" >/dev/null
    echo "[agent] cleanup done"
---
# Агент: isolated-sandbox з мережею (LLM API, K8s API). SA-токен тут потрібен — цеProjected volume
# від kubelet, а не IMDS; network-isolated його не чіпає (перевіряється експериментом 5).
apiVersion: v1
kind: Pod
metadata:
  name: agent
  namespace: agent-demo
spec:
  serviceAccountName: agent
  runtimeClassName: isolated-sandbox
  nodeSelector: { sandbox-runtime: nitro }
  tolerations:
    - { key: sandbox, operator: Equal, value: nitro, effect: NoSchedule }
  containers:
    - name: agent
      # alpine: curl і base64 у комплекті після apk add; busybox wget без TLS-опцій не годиться для K8s API
      image: public.ecr.aws/docker/library/alpine:3.21
      command: ["sh", "-c", "apk add --no-cache curl >/dev/null && sh /agent/agent.sh"]
      env:
        # Демо-код: перевіряє власну ізоляцію і ріже в очі для статті.
        - name: DEMO_CODE
          value: |
            echo "kernel: $(uname -r)"
            echo "interfaces: $(ls /sys/class/net | tr '\n' ' ')"
            if wget -q -T 3 -O /dev/null http://aws.amazon.com; then
              echo "NETWORK: reachable — isolation FAILED"
            else
              echo "NETWORK: blocked — isolation works"
            fi
            if [ -r /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
              echo "SA token: readable — FAILED"
            else
              echo "SA token: absent — expected"
            fi
            echo "uid: $(id -u)"
        # Для LLM: Secret з ключем, увімкни разом із блоком у agent.sh
        # - name: LLM_API_URL
        #   valueFrom: { secretKeyRef: { name: llm-credentials, key: url } }
        # - name: LLM_API_KEY
        #   valueFrom: { secretKeyRef: { name: llm-credentials, key: key } }
      volumeMounts:
        - { name: script, mountPath: /agent }
      resources:
        requests: { cpu: "1", memory: 512Mi }
        limits:   { cpu: "1", memory: 512Mi }
  volumes:
    - name: script
      configMap: { name: agent-script }
